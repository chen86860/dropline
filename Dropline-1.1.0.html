<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="utf-8"></head>
<body style="font: 13px -apple-system, BlinkMacSystemFont, sans-serif; color: #222;">
<h3>新增</h3>
<ul><li><b>访达右键扩展</b>：在 Finder 里选中文件，右键顶层即可「使用 Dropline 上传」， 并可在「系统设置 → 通用 → 登录项与扩展 → 访达扩展」中开关。</li><li><b>系统通知</b>：上传成功或失败时发送通知，点通知即可复制链接（可在设置中关闭）。</li><li><b>菜单栏进度环</b>：上传过程中托盘图标显示实时进度。</li><li><b>关于面板</b>：设置里新增「关于」，展示版本、Bundle ID、更新源与项目主页。</li></ul>
<h3>修复</h3>
<ul><li>上传列表首行被分段控件遮挡。</li><li>菜单栏图标在上传时宽度变化，导致右侧图标横向抖动。</li><li>移除冗余的底部状态栏，清除与复制操作改到列表右键菜单。</li></ul>
</body>
</html>
