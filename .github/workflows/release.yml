name: Release

# 推 tag 即发版：
#   git tag v1.3.0 && git push origin v1.3.0
# 版本号取自 tag（去掉开头的 v），必须已经写进 CHANGELOG.md。
# 构建失败要重来的话，在 Actions 页面点 Re-run；改了代码则删掉 tag 重新打。
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: 构建并发布
    runs-on: macos-latest
    env:
      GH_TOKEN: ${{ github.token }}

    steps:
      - uses: actions/checkout@v7

      - name: 解析版本号
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: 校验 CHANGELOG 里有该版本
        run: ./tools/changelog.py "$VERSION" > /dev/null

      - name: 校验签名私钥已配置
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          if [ -z "$SPARKLE_PRIVATE_KEY" ]; then
            echo "::error::缺少 SPARKLE_PRIVATE_KEY secret，Sparkle 更新包无法签名"
            echo "::error::用 ./tools/sparkle.sh export-key 导出后添加到仓库 Secrets"
            exit 1
          fi

      - name: 缓存 SwiftPM 依赖
        uses: actions/cache@v6
        with:
          path: .build
          key: spm-${{ runner.os }}-${{ hashFiles('Package.resolved', 'Package.swift') }}
          restore-keys: spm-${{ runner.os }}-

      - name: 安装 create-dmg
        run: brew install create-dmg

      - name: 构建 App
        run: DROPLINE_VERSION="$VERSION" DROPLINE_SKIP_REGISTER=1 ./build.sh

      - name: 打包 DMG
        env:
          # GitHub 的 macOS runner 是有图形会话的，访达美化能跑起来 ——
          # 之前写死了跳过美化的开关，反而让 CI 一直产出没有背景图的裸 DMG。
          # 要求布局必须生效：写不进 .DS_Store 就让这一步失败，而不是悄悄降级。
          DMG_REQUIRE_STYLE: '1'
        run: ./tools/dmg.sh "$VERSION"

      - name: 拉取历史版本安装包
        # generate_appcast 只会为目录里存在的包生成条目；不先取回历史版本，
        # 新的 appcast 会把老版本条目整个丢掉，也无法生成增量包
        run: |
          mkdir -p dist/releases
          for tag in $(gh release list --limit 20 --json tagName -q '.[].tagName'); do
            gh release download "$tag" --pattern 'Dropline-*.zip' --dir dist/releases --clobber || true
          done
          ls -la dist/releases || true

      - name: 打包 zip（Sparkle 更新用）
        run: |
          ditto -c -k --sequesterRsrc --keepParent dist/Dropline.app "dist/releases/Dropline-$VERSION.zip"

      - name: 生成更新说明
        # 输出 HTML 片段（无 DOCTYPE/body），generate_appcast 会把它内嵌进 appcast 的
        # <description>，更新弹窗就不用再去外部拉 HTML 了。
        # appcast 每次都是从零重建，历史版本的说明也要一并备好，否则老条目会没有说明。
        # 英文那份文件名要和安装包同名，generate_appcast 才会认；中文那份带 .zh-Hans
        # 后缀避开它，之后由 tools/appcast_i18n.py 注入。
        run: |
          for zip in dist/releases/Dropline-*.zip; do
            v=$(basename "$zip" .zip); v=${v#Dropline-}
            ./tools/changelog.py "$v" --fragment > "dist/releases/Dropline-$v.html" \
              || { echo "::warning::CHANGELOG.md 里没有 $v，该版本不带更新说明"
                   rm -f "dist/releases/Dropline-$v.html"; }
            ./tools/changelog.py "$v" --lang zh --fragment > "dist/releases/Dropline-$v.zh-Hans.html" \
              || { echo "::warning::CHANGELOG.zh-CN.md 里没有 $v，该版本没有中文更新说明"
                   rm -f "dist/releases/Dropline-$v.zh-Hans.html"; }
          done

      - name: 生成并签名 appcast
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          TOOLS=$(find .build/artifacts -type d -name bin -path '*sparkle*' | head -1)
          printf '%s' "$SPARKLE_PRIVATE_KEY" | "$TOOLS/generate_appcast" dist/releases \
            --ed-key-file - \
            --embed-release-notes \
            --download-url-prefix "https://github.com/${{ github.repository }}/releases/download/v$VERSION/" \
            -o dist/appcast.xml
          python3 - dist/appcast.xml "${{ github.repository }}" <<'PY'
          import re, sys
          path, repo = sys.argv[1], sys.argv[2]
          xml = open(path).read()
          xml = re.sub(r'url="[^"]*/Dropline-([0-9][^"/]*)\.zip"',
                       lambda m: f'url="https://github.com/{repo}/releases/download/v{m.group(1)}/Dropline-{m.group(1)}.zip"',
                       xml)
          open(path, "w").write(xml)
          PY
          # 再给每个条目补一份 xml:lang="zh-Hans" 的说明，Sparkle 按用户语言挑
          ./tools/appcast_i18n.py dist/appcast.xml dist/releases
          cat dist/appcast.xml

      - name: 发布 GitHub Release
        run: |
          ./tools/changelog.py "$VERSION" > notes.md
          {
            echo
            echo "---"
            echo
            echo '下载 `Dropline.dmg`，拖进「应用程序」即可。'
            echo '直链（永远指向最新正式版）：'
            echo '<https://github.com/'"${{ github.repository }}"'/releases/latest/download/Dropline.dmg>'
            echo 'ad-hoc 签名，首次打开请右键 App →「打开」，或执行：'
            echo '`xattr -dr com.apple.quarantine /Applications/Dropline.app`'
          } >> notes.md

          # DMG 与 appcast.xml 的资产名都不带版本号，这样
          # /releases/latest/download/<名字> 永远解析到最新一个正式 Release。
          # Sparkle 的 zip 必须保留版本号：generate_appcast 是从文件名认版本的。
          ASSETS=("dist/Dropline.dmg" "dist/releases/Dropline-$VERSION.zip" "dist/appcast.xml")
          while IFS= read -r d; do ASSETS+=("$d"); done \
            < <(ls dist/releases/*"$VERSION"-*.delta 2>/dev/null || true)

          # tag 由本次推送带来，已存在于远端；Release 可能因重跑而已存在，故留兜底分支
          gh release create "$GITHUB_REF_NAME" "${ASSETS[@]}" \
            --title "Dropline $VERSION" --notes-file notes.md \
          || { gh release upload "$GITHUB_REF_NAME" "${ASSETS[@]}" --clobber
               gh release edit "$GITHUB_REF_NAME" --notes-file notes.md; }

      - name: 上传构建产物
        uses: actions/upload-artifact@v7
        with:
          name: Dropline-${{ env.VERSION }}
          path: |
            dist/Dropline.dmg
            dist/releases/Dropline-${{ env.VERSION }}.zip
            dist/appcast.xml
